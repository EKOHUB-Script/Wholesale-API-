<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKOHUB API - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050506;
            --bg-gradient: radial-gradient(circle at 0% 0%, #0a0a0c 0%, #050506 100%);
            --glass-bg: rgba(255, 255, 255, 0.025);
            --glass-bg-hover: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.3);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Background Lights */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.1;
            pointer-events: none;
        }
        .bg-glow-1 { top: -15%; left: -10%; width: 600px; height: 600px; background: #ffffff; }
        .bg-glow-2 { bottom: -15%; right: -10%; width: 500px; height: 500px; background: #808080; }

        /* Glass Effect */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Moving Reflection */
        .glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.04) 50%, transparent 80%);
            transform: skewX(-20deg);
            pointer-events: none;
            transition: left 0.8s ease-in-out;
            z-index: 1;
        }

        .glass:hover::before { left: 150%; }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            margin: 1rem auto;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px;
        }

        .brand-symbol {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .brand-symbol:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(5deg);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }

        /* Main Layout */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 6rem 1rem 5rem;
            position: relative;
        }

        .hero-tag {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
        }

        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(4rem, 15vw, 12rem);
            font-weight: 600;
            letter-spacing: -0.06em;
            line-height: 0.85;
            margin-bottom: 1.5rem;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,0.1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 100px rgba(255, 255, 255, 0.1);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            padding: 0 0.5rem;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            flex: 1;
            max-width: 400px;
            transition: all 0.2s ease;
        }

        .search-container:focus-within {
            border-color: var(--glass-border-hover);
            background: rgba(255, 255, 255, 0.05);
        }

        .search-container svg {
            color: var(--text-muted);
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }

        .search-input::placeholder { color: var(--text-muted); }

        .glass-btn {
            padding: 0.75rem 1.4rem;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .glass-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--glass-border-hover); }
        .glass-btn:active { transform: scale(0.97); }

        .glass-btn-primary {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .glass-btn-primary:hover {
            background: #e0e0e0;
            border-color: #e0e0e0;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        .glass-btn-danger {
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
        }

        .glass-btn-danger:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        /* Script Grid */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .script-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .script-card:hover {
            transform: translateY(-4px);
            border-color: var(--glass-border-hover);
            box-shadow: var(--shadow-hover);
            background: var(--glass-bg-hover);
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .script-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .script-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.03);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .script-code-preview {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 100px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            line-height: 1.5;
        }

        .script-code-preview::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to bottom, transparent, rgba(10,10,12,0.9));
        }

        .script-url-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            word-break: break-all;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .script-url-box::before {
            content: '$';
            color: var(--text-muted);
        }

        .script-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
            position: relative;
            z-index: 2;
        }

        .action-btn {
            flex: 1;
            padding: 0.6rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            border-color: var(--glass-border);
        }

        .action-btn:active { transform: scale(0.95); }

        .action-btn.copied {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            animation: copySuccess 0.4s ease;
        }

        @keyframes copySuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 255, 255, 0.15); }
            100% { transform: scale(1); }
        }

        .action-btn.delete:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 1rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1.5rem;
            opacity: 0.2;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 90%;
            max-width: 600px;
            padding: 2.5rem;
            background: rgba(15, 15, 18, 0.8);
            border: 1px solid var(--glass-border-hover);
            animation: modalScaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalScaleIn {
            from { transform: translateY(20px) scale(0.98); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 2;
        }

        .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.2s;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover { color: #ffffff; background: rgba(255,255,255,0.05); }

        .form-group { margin-bottom: 1.5rem; position: relative; z-index: 2; }

        .form-label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'JetBrains Mono', monospace;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-textarea {
            font-family: 'JetBrains Mono', monospace;
            min-height: 200px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
        }

        .form-input:disabled { color: var(--text-muted); cursor: not-allowed; }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 2rem;
            position: relative;
            z-index: 2;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border-hover);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 1rem; margin: 0.5rem; border-radius: 12px; }
            main { padding: 1rem 0.5rem 2rem; }
            .hero { padding: 3rem 1rem 4rem; }
            .script-grid { grid-template-columns: 1fr; }
            .action-bar { flex-direction: column; align-items: stretch; padding: 0; }
            .search-container { max-width: 100%; }
            .modal-content { padding: 1.5rem; }
        }
    </style>
</head>

            <div class="form-group">
                <label class="form-label">Identifier</label>
                <input type="text" class="form-input" id="scriptName" placeholder="e.g. drivingempire" autocomplete="off">
            </div>
            <div class="form-group">
                <label class="form-label">Payload (Lua)</label>
                <textarea class="form-textarea" id="scriptContent" placeholder="print('Hello EKOHUB!')"></textarea>
            </div>
            <div class="modal-footer">
                <button class="glass-btn" onclick="closeModal()">Cancel</button>
                <button class="glass-btn glass-btn-primary" onclick="saveScript()">Deploy</button>
            </div>
        </div>
    </div>

    <!-- Modal: Delete Confirmation -->
    <div class="modal-overlay" id="deleteModal">
        <div class="glass modal-content" style="max-width: 440px;">
            <div class="modal-header">
                <h2 class="modal-title">Confirm Termination</h2>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6; font-size: 0.95rem;">
                You are about to permanently terminate "<span id="deleteScriptName" style="color: white; font-weight: 500;"></span>". This action is irreversible.
            </p>
            <div class="modal-footer">
                <button class="glass-btn" onclick="closeDeleteModal()">Abort</button>
                <button class="glass-btn glass-btn-danger" onclick="confirmDelete()">Terminate</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg">Message</span>
    </div>

    <script>
        const API_URL = '/api/scripts';
        let currentDeleteTarget = null;
        let scriptsData = [];

        const icons = {
            copy: '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>',
            edit: '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>',
            trash: '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>',
            check: '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        document.addEventListener('DOMContentLoaded', loadScripts);

        async function loadScripts() {
            try {
                const res = await fetch(API_URL);
                scriptsData = await res.json();
                renderScripts(scriptsData);
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to load scripts.');
            }
        }

        function renderScripts(scripts) {
            const list = document.getElementById('scriptList');
            
            if (scripts.length === 0) {
                list.innerHTML = `
                    <div class="glass empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <h3>No Scripts Found</h3>
                        <p style="margin-top: 0.5rem; font-size: 0.9rem;">Deploy your first script to get started.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = scripts.map(script => {
                const codeString = `loadstring(game:HttpGet("${script.url}"))()`;
                const previewContent = script.content.length > 120 ? script.content.substring(0, 120) + '...' : script.content;
                const lineCount = script.content.split('\n').length;
                
                return `
                <div class="glass script-card">
                    <div class="script-header">
                        <div class="script-name">${escapeHtml(script.name)}</div>
                        <div class="script-meta">${lineCount} LINES</div>
                    </div>
                    <div class="script-code-preview">${escapeHtml(previewContent)}</div>
                    <div class="script-url-box">${escapeHtml(codeString)}</div>
                    <div class="script-actions">
                        <button class="action-btn" onclick="copyUrl('${script.url}', this)">${icons.copy} Copy</button>
                        <button class="action-btn" onclick="editScript('${script.name}')">${icons.edit} Edit</button>
                        <button class="action-btn delete" onclick="openDeleteModal('${script.name}')">${icons.trash} Delete</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Search Functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = scriptsData.filter(script => script.name.toLowerCase().includes(searchTerm));
            renderScripts(filtered);
        });

        function openModal() {
            document.getElementById('modalTitle').innerText = "Deploy Script";
            document.getElementById('scriptName').value = '';
            document.getElementById('scriptContent').value = '';
            document.getElementById('scriptName').disabled = false;
            document.getElementById('scriptModal').classList.add('active');
        }

        function editScript(name) {
            const script = scriptsData.find(s => s.name === name);
            if (!script) return;

            document.getElementById('modalTitle').innerText = "Edit Script";
            document.getElementById('scriptName').value = script.name;
            document.getElementById('scriptContent').value = script.content;
            document.getElementById('scriptName').disabled = true;
            document.getElementById('scriptModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('scriptModal').classList.remove('active');
        }

        async function saveScript() {
            const name = document.getElementById('scriptName').value.trim().toLowerCase();
            const content = document.getElementById('scriptContent').value;
            
            if (!name || !content) {
                showToast('Please fill in all fields.');
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, content })
                });
                
                if (res.ok) {
                    closeModal();
                    await loadScripts();
                    showToast('Script deployed successfully.');
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Failed to save script.');
                }
            } catch (error) {
                showToast('Network error occurred.');
            }
        }

        function openDeleteModal(name) {
            currentDeleteTarget = name;
            document.getElementById('deleteScriptName').innerText = name;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            currentDeleteTarget = null;
        }

        async function confirmDelete() {
            if (!currentDeleteTarget) return;
            
            try {
                const res = await fetch(`${API_URL}/${currentDeleteTarget}`, { method: 'DELETE' });
                if (res.ok) {
                    closeDeleteModal();
                    await loadScripts();
                    showToast('Script terminated.');
                } else {
                    showToast('Failed to delete script.');
                }
            } catch (error) {
                showToast('Network error occurred.');
            }
        }

        function copyUrl(url, btn) {
            const code = `loadstring(game:HttpGet("${url}"))()`;
            navigator.clipboard.writeText(code).then(() => {
                btn.classList.add('copied');
                btn.innerHTML = `${icons.check} Copied`;
                
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = `${icons.copy} Copy`;
                }, 2000);
                showToast('Copied to clipboard.');
            }).catch(err => {
                showToast('Copy failed. Please copy manually.');
                console.error('Copy failed:', err);
            });
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteModal();
            }
        });

        // Close modal if clicking outside
        window.onclick = function(event) {
            const scriptModal = document.getElementById('scriptModal');
            const deleteModal = document.getElementById('deleteModal');
            if (event.target === scriptModal) closeModal();
            if (event.target === deleteModal) closeDeleteModal();
        }
    </script>
</body>
</html>
